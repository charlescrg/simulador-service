version: '3.7'

services:
  sqlserver:
    build: .
    container_name: sqlserver-local
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Password23"
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana

  k6:
    image: grafana/k6
    container_name: k6
    volumes:
      - ./k6_test_script.js:/scripts/k6_test_script.js
    entrypoint: ["k6", "run", "/scripts/k6_test_script.js"]
    depends_on:
      - simulador-service
    environment:
      - K6_NO_SETUP=true
    
  redis:
      image: redis:7
      container_name: redis
      ports:
        - "6379:6379"
      restart: always
      
volumes:
  grafana-storage:
