services:
  postgres:
    image: bitnami/postgresql:15
    container_name: postgres-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRESQL_ENABLE_REMOTE_CONNECTIONS: "yes"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: always

  redis:
    image: redis:7
    container_name: redis-local
    ports:
      - "6379:6379"
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-storage:/var/lib/grafana

  k6:
    image: grafana/k6
    container_name: k6
    volumes:
      - ./k6_test_script.js:/scripts/k6_test_script.js
    entrypoint: ["k6", "run", "/scripts/k6_test_script.js"]
    environment:
      K6_NO_SETUP: "true"

  jaeger:
    image: jaegertracing/all-in-one:1.46
    container_name: jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "9411:9411"
    restart: always

volumes:
  grafana-storage:
