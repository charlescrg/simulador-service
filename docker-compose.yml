version: '3.7'

services:
  sqlserver:
    build: .  
    container_name: sqlserver-hack
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Password23"
    volumes:
      - ./init-db:/init-db
    command: >
      /bin/bash -c "
        /opt/mssql/bin/sqlservr &
        pid=$!;
        echo '⏳ Aguardando SQL Server iniciar...';
        sleep 25;
        echo '▶️ Executando init.sql...';
        sqlcmd -S localhost -U hack -P Password23 -i /init-db/init.sql;
        wait $pid
      "
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage:

