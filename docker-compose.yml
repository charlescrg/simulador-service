services:
  postgres:
    image: bitnami/postgresql:14
    container_name: postgres-local
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRESQL_ENABLE_REMOTE_CONNECTIONS: "yes"
      TZ: America/Sao_Paulo
      POSTGRESQL_TIMEZONE: America/Sao_Paulo
    volumes:
      - postgres-data:/bitnami/postgresql
    restart: always

  redis:
    image: redis:7
    container_name: redis-local
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5
    restart: always

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-storage:/var/lib/grafana

  k6:
    image: grafana/k6
    container_name: k6
    volumes:
      - ./k6_test_script.js:/scripts/k6_test_script.js
    entrypoint: ["k6", "run", "/scripts/k6_test_script.js"]
    environment:
      K6_NO_SETUP: "true"

  jaeger:
    image: jaegertracing/all-in-one:1.46
    container_name: jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "9411:9411"
    restart: always

  simulador-service:
    image: maven:3.9.3-eclipse-temurin-20
    working_dir: /app
    volumes:
      - ./:/app
      - ~/.m2:/root/.m2
    command: ./mvnw quarkus:dev -Ddebug=5005
    ports:
        - "8080:8080"
        - "5005:5005"
    environment:
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: "-Duser.timezone=America/Sao_Paulo"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUARKUS_PROFILE: dev
      EVENTHUB_CONNECTION_STRING: "Endpoint=sb://eventhack.servicebus.windows.net/;SharedAccessKeyName=hack;SharedAccessKey=HeHeVaVqyVkntO2FnjQcs2Ilh/4MUDo4y+AEhKp8z+g=;EntityPath=simulacoes"
    depends_on:
      - postgres
      - redis
      - jaeger

volumes:
  grafana-storage:
  postgres-data:
