# Configura o banco PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/superApp
quarkus.datasource.username=postgres
quarkus.datasource.password=12345

# Flyway (migrar ao iniciar)
quarkus.flyway.migrate-at-start=true

# Configuração Hibernate ORM para criar tabelas (DROP e CREATE a cada start)
#quarkus.hibernate-orm.database.generation=drop-and-create

# Log das queries SQL no console
quarkus.hibernate-orm.log.sql=true

# Desativa Dev Services (não usa Docker para banco)
quarkus.datasource.devservices.enabled=false

#Key
smallrye.jwt.sign.key.location=classpath:keys/privateKey.pem
smallrye.jwt.sign.algorithm=RS256
#smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}
mp.jwt.verify.publickey.location=classpath:publicKey.pem

# Configura o emissor do token (usado no JwtGenerator)
mp.jwt.verify.issuer=https://my-app

# Habilita JWT no Quarkus
quarkus.smallrye-jwt.enabled=true

# Opcionalmente para debug
quarkus.log.category."io.smallrye.jwt".level=DEBUG

#CORS
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200, http://localhost:8080
quarkus.http.cors.methods=GET,POST,PUT,DELETE
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=X-Custom-Header
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=86400

#Swagger
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi
