# Configuração do datasource externo para teste (H2)
quarkus.datasource.external.db-kind=h2
quarkus.datasource.external.username=test
quarkus.datasource.external.password=test
quarkus.datasource.external.jdbc.url=jdbc:h2:mem:external-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.external.jdbc.driver=org.h2.Driver

# Configuração do datasource local (H2)
quarkus.datasource.local.db-kind=h2
quarkus.datasource.local.username=hack
quarkus.datasource.local.password=Password23
quarkus.datasource.local.jdbc.url=jdbc:h2:mem:simulador-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.local.jdbc.driver=org.h2.Driver

# Configuração do Hibernate ORM para o datasource padrão
quarkus.hibernate-orm.local.datasource=local
quarkus.hibernate-orm.local.packages=gov.caixa.simuladorservice.entity.local

# Configuração do Hibernate ORM para o datasource externo
quarkus.hibernate-orm.external.datasource=external
quarkus.hibernate-orm.external.packages=gov.caixa.simuladorservice.entity.external
