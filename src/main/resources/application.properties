# Desativa Dev Services (nÃ£o usa Docker para banco)
quarkus.datasource.devservices.enabled=false

#Key
mp.jwt.verify.publickey.location=classpath:publicKey.pem

# Configura o emissor do token (usado no JwtGenerator)
mp.jwt.verify.issuer=https://my-app

# Habilita JWT no Quarkus
quarkus.smallrye-jwt.enabled=true

#CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=X-Custom-Header
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=86400

#Swagger
quarkus.swagger-ui.always-include=true
quarkus.application.name=Simulador de EmprÃ©stimos
quarkus.application.version=1.0.0-SNAPSHOT
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=Simulador API
quarkus.smallrye-openapi.info-version=1.0.0-SNAPSHOT
quarkus.smallrye-openapi.info-description=API para simulaÃ§Ã£o de emprÃ©stimos com SAC e PRICE
quarkus.smallrye-openapi.info-terms-of-service=http://example.com/terms/
quarkus.smallrye-openapi.info-contact-name=Charles Rodrigues
quarkus.smallrye-openapi.info-contact-email=charles@example.com
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=http://www.apache.org/licenses/LICENSE-2.0.html
quarkus.swagger-ui.path=/swagger-ui

#Eventhub
eventhub.connection-string=Endpoint=sb://eventhack.servicebus.windows.net/;SharedAccessKeyName=hack;SharedAccessKey=...;EntityPath=simulacoes

#Caffeine
quarkus.cache.caffeine.simulacoes.maximum-size=1000
quarkus.cache.caffeine.simulacoes.expire-after-write=10M

#Metricas
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.micrometer.binder.http-server.enabled=true

# Habilita log em arquivo
quarkus.log.file.enable=true

# Caminho do arquivo de log
quarkus.log.file.path=logs/app.log

# RotaÃ§Ã£o de log: tamanho mÃ¡ximo por arquivo
quarkus.log.file.rotation.max-file-size=10M

# Quantidade de arquivos de backup
quarkus.log.file.rotation.max-backup-index=5

# Desabilita logs INFO do Azure SDK e AMQP
quarkus.log.category."com.azure".level=WARN
quarkus.log.category."com.azure.core".level=WARN
quarkus.log.category."com.azure.messaging.eventhubs".level=WARN
quarkus.log.category."com.azure.core.amqp".level=WARN
quarkus.log.category."com.azure.core.amqp.impl".level=WARN
