# ConfiguraÃ§Ã£o do datasource LOCAL

# Log das queries SQL no console
quarkus.hibernate-orm.log.sql=true

# Opcionalmente para debug
quarkus.log.category."io.smallrye.jwt".level=WARN
quarkus.log.console.json=true

#Circuit break
quarkus.log.category."io.smallrye.faulttolerance".level=WARN

# Banco H2 em memória
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:simulador;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=hack
quarkus.datasource.password=Password23

# Ativar console H2 (opcional)
quarkus.datasource.jdbc.driver=org.h2.Driver

# Ativar console H2
quarkus.devservices.enabled=true

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration






