name: Build Quarkus App with PostgreSQL and Redis

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: bitnami/postgresql:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
        options: >-
          --health-cmd "pg_isready -U postgres" 
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache dependências Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: Cache Maven Wrapper
        uses: actions/cache@v3
        with:
          path: |
            .mvn/wrapper
            mvnw
          key: maven-wrapper-${{ hashFiles('mvnw', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            maven-wrapper-

      - name: Verificar conexão com o PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Aguardando PostgreSQL..."
            sleep 2
          done

      - name: Verificar conexão com o Redis
        run: |
          for i in {1..30}; do
            redis-cli -h localhost ping && break
            echo "Aguardando Redis..."
            sleep 2
          done

      - name: Build com Maven
        run: mvn clean verify -Dquarkus.analytics.enabled=false
        env:
          CI: true
          QUARKUS_DATASOURCE_LOCAL_DB_KIND: postgresql
          QUARKUS_DATASOURCE_LOCAL_JDBC_URL: jdbc:postgresql://localhost:5432/postgres
          QUARKUS_DATASOURCE_LOCAL_USERNAME: postgres
          QUARKUS_DATASOURCE_LOCAL_PASSWORD: 12345
          REDIS_HOST: localhost
          REDIS_PORT: 6379
